[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "bitplane-search"
version = "0.1.0"
description = "Weighted binary retrieval with bucket-local bitplanes"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "faiss-cpu>=1.9,<2",
    "matplotlib>=3.8,<4",
    "sentence-transformers>=5.3,<7",
    "transformers>=5.5,<6",
    "torch>=2.5,<3",
    "threadpoolctl>=3,<4",
    "huggingface-hub>=1,<2",
    "psutil>=7,<8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
